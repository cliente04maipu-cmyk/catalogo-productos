<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de Fotos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4">📸 Mi Galería de Fotos</h1>
            <p class="lead">Haz clic en cualquier foto para ver sus detalles</p>
        </header>

        <div id="galeria" class="row g-4">
            <!-- Las fotos se cargarán aquí -->
        </div>
    </div>

    <!-- MODAL PARA ZOOM DE IMÁGENES -->
    <div class="modal fade" id="zoomModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" 
                            data-bs-dismiss="modal" aria-label="Cerrar" 
                            style="z-index: 1050; font-size: 2rem; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));">
                    </button>
                    <img id="imagenZoom" src="" alt="Zoom" class="img-fluid rounded" 
                         style="max-height: 90vh; width: 100%; object-fit: contain;">
                    <div id="infoZoom" class="text-center text-white mt-2" 
                         style="text-shadow: 0 0 10px rgba(0,0,0,0.8);">
                        <!-- Aquí se mostrará el nombre de la foto -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/galeria.js"></script>
</body>
</html>
